<rect x="510" y="96" width="430" height="285" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="510" y="96" width="6" height="285" rx="3" fill="#10b981"/>
<text x="534" y="130" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">E07 · QLoRA / LoRA</text>
<text x="64" y="169" font-family="Arial" font-size="32" font-weight="800" fill="#3b82f6" text-anchor="start">2.009×</text>
<text x="64" y="193" font-family="Arial" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">KV token capacity</text>
<text x="246" y="211" font-family="Arial" font-size="11" font-weight="700" fill="#64748b" text-anchor="end">BF16</text>
<text x="294" y="211" font-family="Arial" font-size="11" font-weight="700" fill="#ef4444" text-anchor="start">FP8</text>
<text x="64" y="232" font-family="Arial" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Schema pass</text>
<text x="246" y="232" font-family="Arial" font-size="13" font-weight="650" fill="#0f172a" text-anchor="end">92.0%</text>
<text x="270" y="232" font-family="Arial" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">→</text>
<text x="294" y="232" font-family="Arial" font-size="13" font-weight="700" fill="#ef4444" text-anchor="start">70.0%</text>
<text x="64" y="274" font-family="Arial" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Root-cause F1</text>
<text x="246" y="274" font-family="Arial" font-size="13" font-weight="650" fill="#0f172a" text-anchor="end">71.9%</text>
<text x="270" y="274" font-family="Arial" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">→</text>
