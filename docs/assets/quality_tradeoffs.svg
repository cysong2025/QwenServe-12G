<text x="246" y="316" font-family="Arial" font-size="13" font-weight="650" fill="#0f172a" text-anchor="end">52.1%</text>
<text x="270" y="316" font-family="Arial" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">→</text>
<text x="294" y="316" font-family="Arial" font-size="13" font-weight="700" fill="#ef4444" text-anchor="start">36.5%</text>
<rect x="64" y="343" width="250" height="25" rx="12" fill="#fee2e2"/>
<text x="189" y="360" font-family="Arial" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Capacity PASS · quality FAIL</text>
<text x="716" y="169" font-family="Arial" font-size="11" font-weight="700" fill="#64748b" text-anchor="end">Base</text>
<text x="764" y="169" font-family="Arial" font-size="11" font-weight="700" fill="#10b981" text-anchor="start">LoRA</text>
