<text x="716" y="210" font-family="Arial" font-size="13" font-weight="650" fill="#0f172a" text-anchor="end">92.0%</text>
<text x="740" y="210" font-family="Arial" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">→</text>
<text x="764" y="210" font-family="Arial" font-size="13" font-weight="700" fill="#10b981" text-anchor="start">100.0%</text>
<text x="534" y="252" font-family="Arial" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Root-cause F1</text>
