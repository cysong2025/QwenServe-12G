<text x="740" y="252" font-family="Arial" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">→</text>
<text x="764" y="252" font-family="Arial" font-size="13" font-weight="700" fill="#10b981" text-anchor="start">93.7%</text>
<text x="534" y="294" font-family="Arial" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Action F1</text>
<text x="716" y="294" font-family="Arial" font-size="13" font-weight="650" fill="#0f172a" text-anchor="end">52.1%</text>
<text x="740" y="294" font-family="Arial" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">→</text>
<text x="764" y="294" font-family="Arial" font-size="13" font-weight="700" fill="#10b981" text-anchor="start">94.0%</text>
<rect x="534" y="343" width="320" height="25" rx="12" fill="#fef3c7"/>
<text x="694" y="360" font-family="Arial" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Quality PASS · online latency FAIL (4/6 cells)</text>
<text x="40" y="414" font-family="Arial" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">Both negative deployment decisions are preserved; neither result is relabeled as a successful default.</text>
