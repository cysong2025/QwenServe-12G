<rect x="0" y="0" width="980" height="430" rx="16" fill="#ffffff"/>
<text x="40" y="42" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Quality and capacity trade-offs</text>
<text x="40" y="68" font-family="Arial" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">A gain is deployable only when its frozen quality and latency gates also pass</text>
<rect x="40" y="96" width="430" height="285" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
