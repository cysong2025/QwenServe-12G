<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
<title id="title">Quality and capacity trade-offs</title>
<desc id="desc">Generated from committed QwenServe-12G experiment reports.</desc>
<style>
