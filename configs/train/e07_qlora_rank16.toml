[profile]
name = "e07_qlora_rank16"
description = "E07 rank-16 QLoRA quality ablation with otherwise matched controls"

[model]
name = "Qwen/Qwen2.5-3B-Instruct"
revision = "a1d308dfcc03e09da285d49d912439a655a571e8"

[data]
train_file = "datasets/e07_sft/train.jsonl"
validation_file = "datasets/e07_sft/validation.jsonl"
manifest = "datasets/e07_sft/dataset_manifest.json"

[lora]
rank = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[training]
max_seq_length = 1024
micro_batch_size = 1
gradient_accumulation_steps = 16
epochs = 3.0
max_steps = 0
learning_rate = 0.0002
warmup_ratio = 0.05
max_train_samples = 0
seed = 20260824
gradient_checkpointing = true

[output]
adapter_dir = "artifacts/adapters/e07/rank16"
