[profile]
name = "e00_smoke"
server_profile = "baseline_bf16"
server_config = "../serve/baseline.toml"

[benchmark]
model = "Qwen/Qwen2.5-3B-Instruct"
served_model_name = "qwen2.5-3b-instruct"
base_url = "http://127.0.0.1:8000"
endpoint = "/v1/completions"
dataset_name = "random"
input_len = 128
output_len = 32
num_prompts = 8
request_rate = "inf"
burstiness = 1.0
max_concurrency = 1
num_warmups = 2
metric_percentiles = [50, 95, 99]
goodput_ttft_ms = 1000
goodput_tpot_ms = 50
seed = 20260730
temperature = 0.0
ignore_eos = true
repetitions = 1
cooldown_seconds = 0
ready_check_timeout_seconds = 60
result_dir = "artifacts/results/e00_smoke"
